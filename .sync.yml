---
".gitlab-ci.yml":
  delete: true
".rubocop.yml":
  include_todos: true
appveyor.yml:
  delete: true

Gemfile:
  optional:
    ":development":
    - gem: ruby-pwsh
    - gem: mocha
      version: '< 1.2.0'
    ":system_tests":
    - gem: rspec-retry
Rakefile:
  changelog_since_tag: 3.5.0
spec/spec_helper.rb:
  unmanaged: true
  coverage_report: true
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
.github/workflows/ci.yml:
  unmanaged: true
  acceptance_flags:
  - "--provision-prefer provision_service"
  - "--provision-exclude docker"
  - "--arch-exclude arm"
  - "--puppetlabs"
  - "--nightly"
  - "--platform-exclude centos-8"
  - "--collection-platform-exclude 9:centos-7"
  - "--collection-platform-exclude 9:debian-10"
  - "--collection-platform-exclude 9:ubuntu-18.04"
  - "--collection-platform-exclude 9:ubuntu-20.04"
.github/workflows/nightly.yml:
  unmanaged: true
  cron: '50 0 * * *'
  acceptance_flags:
  - "--provision-prefer provision_service"
  - "--provision-exclude docker"
  - "--arch-exclude arm"
  - "--puppetlabs"
  - "--nightly"
  - "--platform-exclude centos-8"
  - "--collection-platform-exclude 9:centos-7"
  - "--collection-platform-exclude 9:debian-10"
  - "--collection-platform-exclude 9:ubuntu-18.04"
  - "--collection-platform-exclude 9:ubuntu-20.04"
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
.devcontainer/Dockerfile:
  unmanaged: true
common:
  service_url: https://facade-cat-2498s-1079112402178.europe-west1.run.app/v1/provision